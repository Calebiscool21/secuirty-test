      padding: 32px;

      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

      color: #ffffff;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s ease;
    }
    .btn:hover {

    }
    .btn-secondary {
      background-color: #475569;
      margin-top: 12px;
    }
    .btn-secondary:hover {

    }
    #error-box {

      margin-top: 16px;

      background-color: #450a0a;
      border: 1px solid #991b1b;
      color: #fca5a5;
      border-radius: 6px;
      font-size: 0.85rem;
      text-align: left;
      word-break: break-word;
    }
    #protected-content {

    }
  </style>
</head>
